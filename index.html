<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 10</title>
    <style>
        body{
            min-height: 100dvh;
            background-color: #e1e1e1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            flex-direction: column;
            overflow: hidden;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: gray;
            border-radius: 1rem;
        }
        .buttons{
            position: relative;
            top: 100px;
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <div class="buttons">
        <button class="buttonstart">Iniciar</button>
        <button class="buttonstop">Parar</button>
        <button class="buttonreverse">Reverter</button>
        <button class="buttonrestart">Recomeçar</button>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
